# OpenSSF Scorecard: checks the repository's supply-chain practices — pinned dependencies, token permissions,
# branch protection, code review and so on — and publishes the score behind the README's badge. Findings appear
# under the repository's Security tab.
#
# Publishing binds the workflow to Scorecard's rules: no workflow-level env, defaults or write permissions, and only
# its approved actions in the job, on an Ubuntu runner.

name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 6'
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Uploads the findings.
      security-events: write
      # Proves to Scorecard's API which workflow published the results.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
