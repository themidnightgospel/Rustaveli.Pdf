# OpenSSF Scorecard: checks the repository's supply-chain practices — pinned dependencies, token permissions,
# branch protection, code review and so on — and publishes the score behind the README's badge. Findings appear
# under the repository's Security tab.
#
# Publishing binds the workflow to Scorecard's rules: no workflow-level env, defaults or write permissions, and only
# its approved actions in the job, on an Ubuntu runner.

name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 6'
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Uploads the findings.
      security-events: write
      # Proves to Scorecard's API which workflow published the results.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
