# Mutation testing of the whole engine on main, every night and at no other time: it takes hours, and pull requests
# should not wait for it. A shard that falls below the 80% floor, or fails, opens an issue — work for the next pull
# request. Set off the hour: GitHub delays or drops scheduled runs when load is highest, which is on the hour.

name: Nightly mutation testing

on:
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: nightly-mutation
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Sharded by source file: one job over the whole engine needs many hours on a four-core hosted runner, where the
  # first test run alone takes some twenty minutes. A shard's time depends as much on how many of its mutants time out
  # as on how many there are: 444 mutants have taken 268 minutes, and 985 have taken 223. The same shard can run a
  # third longer one night than another, so split a shard once any night takes it past about four hours. Each shard
  # must clear the 80% floor on its own, which is stricter than a single overall score. Split a shard by file name, and
  # a file too large alone by character span — "File.cs{0..23000}" — a span counting characters, not lines.
  # At most twelve shards run at once, the rest queueing behind them: the account runs twenty jobs at a time, and
  # GitHub can start a scheduled run hours late, into the working day, where taking every runner would hold pull
  # requests' checks until the shards finish.
  mutation:
    name: mutation testing (Stryker, break < 80%) · ${{ matrix.shard.name }}
    runs-on: ${{ matrix.shard.os || 'ubuntu-latest' }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard:
          - name: text-block-a
            mutate: --mutate "**/Blocks/TextBlock.cs{0..23000}"
          - name: text-block-b
            mutate: --mutate "**/Blocks/TextBlock.cs{23000..42000}"
          - name: text-block-c
            mutate: --mutate "**/Blocks/TextBlock.cs{42000..61000}"
          - name: text-block-d
            mutate: --mutate "**/Blocks/TextBlock.cs{61000..200000}"
          - name: table-block
            mutate: --mutate "**/Blocks/TableBlock.cs"
          - name: blocks-a-c
            mutate: --mutate "**/Blocks/[A-C]*.cs"
          - name: blocks-d-f
            mutate: --mutate "**/Blocks/[D-F]*.cs"
          - name: blocks-g-l
            mutate: --mutate "**/Blocks/[G-L]*.cs"
          - name: blocks-m-r
            mutate: --mutate "**/Blocks/[M-R]*.cs"
          - name: blocks-s-z
            mutate: >-
              --mutate "**/Blocks/[S-Z]*.cs" --mutate "!**/Blocks/TextBlock.cs" --mutate "!**/Blocks/TableBlock.cs"
          - name: layout-a-l-text
            mutate: >-
              --mutate "**/Layout/[A-L]*.cs" --mutate "**/Text/*.cs" --mutate "!**/Text/TypeShaper.cs"
              --mutate "!**/Text/GlyphWalk.cs" --mutate "!**/Text/OpenTypeMeasurer.cs"
          - name: layout-m-z
            mutate: --mutate "**/Layout/[M-Z]*.cs"
          # The generated character tables are data, not logic: Stryker skips files marked auto-generated.
          - name: line-breaking-a
            mutate: --mutate "**/Text/LineBreaking/LineBreakEnumerator.cs{0..11000}"
          - name: line-breaking-b
            mutate: >-
              --mutate "**/Text/LineBreaking/LineBreakEnumerator.cs{11000..200000}" --mutate "**/Text/LineBreaking/LineBreak.cs"
              --mutate "**/Text/LineBreaking/LineBreak[CP]*.cs" --mutate "**/Text/LineBreaking/LineBreaker.cs"
          - name: bidi-paragraph
            mutate: >-
              --mutate "**/Text/Bidi/Bidi*.cs" --mutate "**/Text/Bidi/LineReordering.cs"
              --mutate "!**/Text/Bidi/BidiCharacterTables.cs"
          - name: bidi-resolution
            mutate: >-
              --mutate "**/Text/Bidi/ExplicitLevels.cs" --mutate "**/Text/Bidi/IsolatingRunSequence.cs"
              --mutate "**/Text/Bidi/BracketPairs.cs"
          - name: primitives-a-n
            mutate: --mutate "**/Primitives/[A-N]*.cs"
          - name: primitives-o-t
            mutate: --mutate "**/Primitives/[O-T]*.cs"
          - name: primitives-u-z
            mutate: --mutate "**/Primitives/[U-Z]*.cs"
          - name: composition-a-e
            mutate: --mutate "**/Composition/[A-E]*.cs"
          - name: composition-f
            mutate: --mutate "**/Composition/F*.cs"
          - name: composition-g-r-exceptions
            mutate: --mutate "**/Composition/[G-R]*.cs" --mutate "**/Exceptions/**/*.cs"
          - name: composition-s-z
            mutate: --mutate "**/Composition/[S-Z]*.cs"
          - name: drawing
            mutate: --mutate "**/Drawing/**/*.cs"
          - name: writing-values
            mutate: >-
              --mutate "**/Writing/[A-O]*.cs" --mutate "**/Writing/[X-Z]*.cs" --mutate "**/Writing/Pdf[A-C]*.cs"
          - name: security
            mutate: --mutate "**/Security/**/*.cs"
          - name: operations-reading-source
            project: --project Rustaveli.Pdf.Operations.csproj
            mutate: --mutate "**/Reading/PdfSource.cs" --mutate "**/Reading/Source*.cs"
          - name: operations-reading-parser
            project: --project Rustaveli.Pdf.Operations.csproj
            mutate: --mutate "**/Reading/PdfParser.cs" --mutate "**/Reading/StreamDecoder.cs"
          - name: operations-assembly
            project: --project Rustaveli.Pdf.Operations.csproj
            fonts: true
            tests: >-
              --test-project tests/Rustaveli.Pdf.UnitTests/Rustaveli.Pdf.UnitTests.csproj
              --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: --mutate "**/Assembly/**/*.cs" --mutate "**/PdfFile.cs"
          - name: preview
            project: --project Rustaveli.Pdf.Preview.csproj
            fonts: true
            tests: --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: --mutate "**/*.cs"
          - name: operations-linearization-a
            project: --project Rustaveli.Pdf.Operations.csproj
            fonts: true
            tests: >-
              --test-project tests/Rustaveli.Pdf.UnitTests/Rustaveli.Pdf.UnitTests.csproj
              --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: --mutate "**/Linearization/BitWriter.cs" --mutate "**/Linearization/Linearizer.cs{0..12000}"
          - name: operations-linearization-b
            project: --project Rustaveli.Pdf.Operations.csproj
            fonts: true
            tests: >-
              --test-project tests/Rustaveli.Pdf.UnitTests/Rustaveli.Pdf.UnitTests.csproj
              --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: --mutate "**/Linearization/Linearizer.cs{12000..200000}"
          - name: writing-files
            mutate: --mutate "**/Writing/Pdf[D-F]*.cs"
          - name: writing-objects
            mutate: --mutate "**/Writing/Pdf[G-Z]*.cs"
          - name: fonts-b-cff
            mutate: --mutate "**/Fonts/B*.cs" --mutate "**/Fonts/Cff*.cs" --mutate "!**/Fonts/CffSubsetter.cs"
          - name: fonts-cff-subsetter
            mutate: --mutate "**/Fonts/CffSubsetter.cs"
          - name: fonts-ch
            mutate: --mutate "**/Fonts/Ch*.cs"
          - name: fonts-cl-co
            mutate: --mutate "**/Fonts/C[l-o]*.cs"
          - name: fonts-d-f
            mutate: --mutate "**/Fonts/[D-F]*.cs"
          - name: fonts-g
            mutate: --mutate "**/Fonts/G*.cs"
          - name: fonts-h-n
            mutate: --mutate "**/Fonts/[H-N]*.cs"
          - name: substitution-engine
            mutate: >-
              --mutate "**/Fonts/Substitution/GlyphSubstitutionTable.cs" --mutate "**/Fonts/Substitution/GlyphBuffer.cs"
              --mutate "**/Fonts/Substitution/Substitution[LSU]*.cs" --mutate "**/Fonts/Substitution/*Tag.cs"
              --mutate "**/Fonts/Substitution/FeatureSetting.cs"
          - name: substitution-lookups
            mutate: >-
              --mutate "**/Fonts/Substitution/*Substitution.cs" --mutate "**/Fonts/Substitution/Context*.cs"
          - name: fonts-o-r
            mutate: --mutate "**/Fonts/[O-R]*.cs"
          - name: fonts-s-z
            mutate: --mutate "**/Fonts/[S-Z]*.cs" --mutate "!**/Fonts/TypefaceLibrary.cs"
          # Decoding tests hold whole images in memory; three runners over them ran the hosted runner out of it.
          - name: images-a-i
            runners: 2
            mutate: --mutate "**/Images/[A-I]*.cs"
          - name: images-jpeg-png-a-h
            runners: 2
            mutate: --mutate "**/Images/[J-O]*.cs" --mutate "**/Images/Png[A-H]*.cs"
          - name: images-png-i-p
            runners: 2
            mutate: --mutate "**/Images/Png[I-P]*.cs"
          - name: images-png-q-z
            runners: 2
            mutate: --mutate "**/Images/Png[Q-Z]*.cs"
          - name: images-r-z
            runners: 2
            mutate: --mutate "**/Images/[Q-Z]*.cs"
          - name: svg-reader-a
            mutate: --mutate "**/Svg/SvgReader.cs{0..21000}"
          - name: svg-reader-b
            mutate: --mutate "**/Svg/SvgReader.cs{21000..200000}"
          - name: svg-values-c-n
            mutate: --mutate "**/Svg/Svg[C-N]*.cs"
          - name: svg-values-p-t
            mutate: --mutate "**/Svg/Svg[P-T]*.cs" --mutate "!**/Svg/SvgReader.cs"
          - name: tagging
            mutate: --mutate "**/Tagging/**/*.cs"
          # The PDF surface, shaping and the typeface library are checked by reading real files back, so these
          # shards run the integration tests too — and those need the system's fallback fonts.
          - name: output-surface
            fonts: true
            tests: >-
              --test-project tests/Rustaveli.Pdf.UnitTests/Rustaveli.Pdf.UnitTests.csproj
              --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: --mutate "**/Output/PdfSurface.cs"
          # Page images are checked against PDFium's rendering of the same page, in the conformance tests, which need
          # the validators; XPS is written only on Windows, so this shard runs there.
          - name: raster
            os: windows-latest
            tools: true
            project: --project Rustaveli.Pdf.Raster.csproj
            tests: >-
              --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
              --test-project tests/Rustaveli.Pdf.ConformanceTests/Rustaveli.Pdf.ConformanceTests.csproj
            mutate: --mutate "**/*.cs"
          - name: shaping
            project: --project Rustaveli.Pdf.Shaping.csproj
            tests: --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: --mutate "**/*.cs"
          - name: typesetting-output
            fonts: true
            tests: >-
              --test-project tests/Rustaveli.Pdf.UnitTests/Rustaveli.Pdf.UnitTests.csproj
              --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: --mutate "**/Output/**/*.cs" --mutate "!**/Output/PdfSurface.cs"
          - name: typesetting-text
            fonts: true
            tests: >-
              --test-project tests/Rustaveli.Pdf.UnitTests/Rustaveli.Pdf.UnitTests.csproj
              --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: >-
              --mutate "**/Fonts/TypefaceLibrary.cs" --mutate "**/Text/TypeShaper.cs" --mutate "**/Text/GlyphWalk.cs"
              --mutate "**/Text/OpenTypeMeasurer.cs"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet tool restore

      - name: Install fallback fonts
        if: matrix.shard.fonts
        uses: ./.github/actions/apt-install
        with:
          packages: fonts-noto-core fonts-noto-cjk

      - name: Fetch validators (qpdf, veraPDF and its Java)
        if: matrix.shard.tools
        run: dotnet run eng/tools.cs

      # Three test runners, two where the integration tests run too or a shard says so: four, one a core, ran the
      # hosted runner out of memory as they started, and it was shut down mid-run. A mutant that removes a size guard
      # can ask for more memory than the machine has, with the same result and every mutant's outcome lost, so each
      # test process's heap is capped at 6 GB (tests/Directory.Build.props): such a mutant meets an
      # OutOfMemoryException its tests fail on, and is killed. Stryker's own process is not capped: it holds every
      # mutant's result, and under the cap it ran out of memory testing, or writing its reports.
      # The reports are the summary read below and the JSON report uploaded with it, which has every mutant. The
      # HTML report is not written: it builds the whole report as one string, and ran out of memory after every
      # mutant had been tested.
      - name: Mutation testing
        env:
          MutationTestHeapLimit: '6442450944'
        run: >
          dotnet stryker --config-file stryker-config.json
          --reporter progress --reporter markdown --reporter json
          --concurrency ${{ matrix.shard.runners || (matrix.shard.fonts && 2 || 3) }}
          ${{ matrix.shard.project }} ${{ matrix.shard.tests }} ${{ matrix.shard.mutate }}

      - name: Publish mutation summary
        if: always()
        run: |
          report=$(find StrykerOutput -name 'mutation-report.md' | head -n 1)
          if [ -n "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-${{ matrix.shard.name }}
          path: StrykerOutput/**/reports
          retention-days: 14

  # A shard below the floor is work for the next pull request, so it is filed as an issue — one, kept open until
  # fixed, however many nights it fails.
  report:
    name: report a failed night
    needs: mutation
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue unless one is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly mutation testing failed"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq length)
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$open" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "A mutation shard fell below the 80% floor, or failed, on main: $run. Its report is attached to the run."
          else
            number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $run"
          fi
