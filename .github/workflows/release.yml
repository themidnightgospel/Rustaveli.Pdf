# Publishes the packages when a version tag is pushed: tag v1.2.3 publishes 1.2.3. The tag must name the version
# Directory.Build.props already carries, so a release is always a commit that says what it is. Everything is built
# and tested again on Windows, where both runtimes and every validator run, before anything leaves.
#
# Publishes by trusted publishing, with no stored key: the job proves to nuget.org who it is with a token GitHub
# signs, and is given a key that lasts an hour. It needs, on nuget.org, a trusted publishing policy for this
# repository's owner and name and the workflow file release.yml, allowed to push the Rustaveli.Pdf* packages; and
# here, the repository secret NUGET_USER: the nuget.org user name (not the email address) that owns the policy.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: build, test, pack and publish
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      # Lets the job ask GitHub for the signed token nuget.org trades for a key.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check the tag names the version being built
        shell: bash
        run: |
          version=$(dotnet msbuild src/Rustaveli.Pdf/Rustaveli.Pdf.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Directory.Build.props ($version)."
            exit 1
          fi

      - name: Fetch validators (qpdf, veraPDF and its Java)
        run: dotnet run eng/tools.cs

      - name: Build (Release, warnings are errors)
        run: dotnet build Rustaveli.Pdf.slnx -c Release

      - name: Test on both runtimes
        run: dotnet test Rustaveli.Pdf.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Rustaveli.Pdf.slnx -c Release --no-build -o artifacts/packages

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/packages
          retention-days: 90

      # Asked for only now, after the tests: the key it hands back lasts an hour.
      - name: Sign in to nuget.org
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # The symbol packages go up with them.
      - name: Publish to nuget.org
        shell: bash
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are the changelog's section for this version.
          awk -v heading="## ${GITHUB_REF_NAME#v}" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg --title "$GITHUB_REF_NAME" --notes-file notes.md
