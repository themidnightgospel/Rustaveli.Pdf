# Tier 2: the expensive checks, run once a pull request is labelled ready-to-merge (and again on any push after
# that). A PR merges only when both this and ci.yml are green. Split out because mutation testing, benchmarks and
# macOS minutes cost too much to spend on every intermediate push.

name: gate

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Sharded by source file: one job over the whole engine needs many hours on a four-core hosted runner, where the
  # first test run alone takes some twenty minutes and a shard of more than about 300 mutants outruns the timeout.
  # Each shard must clear the 80% floor on its own, which is stricter than a single overall score. Rebalance a shard
  # by file name once its area grows past that size, and split a file too large alone by character span —
  # "File.cs{0..23000}" — a span counting characters, not lines; shards beyond the concurrent-job limit simply queue.
  mutation:
    name: mutation testing (Stryker, break < 80%) · ${{ matrix.shard.name }}
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: text-block-a
            mutate: --mutate "**/Blocks/TextBlock.cs{0..23000}"
          - name: text-block-b
            mutate: --mutate "**/Blocks/TextBlock.cs{23000..200000}"
          - name: table-block
            mutate: --mutate "**/Blocks/TableBlock.cs"
          - name: blocks-a-l
            mutate: --mutate "**/Blocks/[A-L]*.cs"
          - name: blocks-m-z
            mutate: >-
              --mutate "**/Blocks/[M-Z]*.cs" --mutate "!**/Blocks/TextBlock.cs" --mutate "!**/Blocks/TableBlock.cs"
          - name: layout-text
            mutate: >-
              --mutate "**/Layout/**/*.cs" --mutate "**/Text/*.cs" --mutate "!**/Text/TypeShaper.cs"
              --mutate "!**/Text/GlyphWalk.cs" --mutate "!**/Text/OpenTypeMeasurer.cs"
          # The generated character tables are data, not logic: Stryker skips files marked auto-generated.
          - name: line-breaking-a
            mutate: --mutate "**/Text/LineBreaking/LineBreakEnumerator.cs{0..11000}"
          - name: line-breaking-b
            mutate: >-
              --mutate "**/Text/LineBreaking/LineBreakEnumerator.cs{11000..200000}" --mutate "**/Text/LineBreaking/LineBreak.cs"
              --mutate "**/Text/LineBreaking/LineBreak[CP]*.cs" --mutate "**/Text/LineBreaking/LineBreaker.cs"
          - name: bidi-paragraph
            mutate: >-
              --mutate "**/Text/Bidi/Bidi*.cs" --mutate "**/Text/Bidi/LineReordering.cs"
              --mutate "!**/Text/Bidi/BidiCharacterTables.cs"
          - name: bidi-resolution
            mutate: >-
              --mutate "**/Text/Bidi/ExplicitLevels.cs" --mutate "**/Text/Bidi/IsolatingRunSequence.cs"
              --mutate "**/Text/Bidi/BracketPairs.cs"
          - name: primitives
            mutate: --mutate "**/Primitives/**/*.cs"
          - name: composition-drawing
            mutate: >-
              --mutate "**/Composition/**/*.cs" --mutate "**/Drawing/**/*.cs" --mutate "**/Exceptions/**/*.cs"
          - name: writing-values
            mutate: >-
              --mutate "**/Writing/[A-O]*.cs" --mutate "**/Writing/Z*.cs" --mutate "**/Writing/Pdf[A-C]*.cs"
          - name: writing-files
            mutate: --mutate "**/Writing/Pdf[D-F]*.cs"
          - name: writing-objects
            mutate: --mutate "**/Writing/Pdf[G-Z]*.cs"
          - name: fonts-a-c
            mutate: --mutate "**/Fonts/[A-C]*.cs"
          - name: fonts-d-f
            mutate: --mutate "**/Fonts/[D-F]*.cs"
          - name: fonts-g
            mutate: --mutate "**/Fonts/G*.cs"
          - name: fonts-h-n
            mutate: --mutate "**/Fonts/[H-N]*.cs"
          - name: substitution-engine
            mutate: >-
              --mutate "**/Fonts/Substitution/GlyphSubstitutionTable.cs" --mutate "**/Fonts/Substitution/GlyphBuffer.cs"
              --mutate "**/Fonts/Substitution/Substitution[LSU]*.cs" --mutate "**/Fonts/Substitution/*Tag.cs"
              --mutate "**/Fonts/Substitution/FeatureSetting.cs"
          - name: substitution-lookups
            mutate: >-
              --mutate "**/Fonts/Substitution/*Substitution.cs" --mutate "**/Fonts/Substitution/Context*.cs"
          - name: fonts-o-r
            mutate: --mutate "**/Fonts/[O-R]*.cs"
          - name: fonts-s-z
            mutate: --mutate "**/Fonts/[S-Z]*.cs" --mutate "!**/Fonts/TypefaceLibrary.cs"
          - name: images-a-i
            mutate: --mutate "**/Images/[A-I]*.cs"
          - name: images-jpeg-png-a-h
            mutate: --mutate "**/Images/[J-O]*.cs" --mutate "**/Images/Png[A-H]*.cs"
          - name: images-png-i-z
            mutate: --mutate "**/Images/Png[I-Z]*.cs"
          - name: images-r-z
            mutate: --mutate "**/Images/[Q-Z]*.cs"
          # The PDF surface, shaping and the typeface library are checked by reading real files back, so these
          # shards run the integration tests too — and those need the system's fallback fonts.
          - name: output-surface
            fonts: true
            tests: >-
              --test-project tests/Rustaveli.Pdf.UnitTests/Rustaveli.Pdf.UnitTests.csproj
              --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: --mutate "**/Output/PdfSurface.cs"
          - name: shaping
            project: --project Rustaveli.Pdf.Shaping.csproj
            tests: --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: --mutate "**/*.cs"
          - name: typesetting-output
            fonts: true
            tests: >-
              --test-project tests/Rustaveli.Pdf.UnitTests/Rustaveli.Pdf.UnitTests.csproj
              --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: --mutate "**/Output/**/*.cs" --mutate "!**/Output/PdfSurface.cs"
          - name: typesetting-text
            fonts: true
            tests: >-
              --test-project tests/Rustaveli.Pdf.UnitTests/Rustaveli.Pdf.UnitTests.csproj
              --test-project tests/Rustaveli.Pdf.IntegrationTests/Rustaveli.Pdf.IntegrationTests.csproj
            mutate: >-
              --mutate "**/Fonts/TypefaceLibrary.cs" --mutate "**/Text/TypeShaper.cs" --mutate "**/Text/GlyphWalk.cs"
              --mutate "**/Text/OpenTypeMeasurer.cs"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet tool restore

      - name: Install fallback fonts
        if: matrix.shard.fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk

      # Three test runners, two where the integration tests run too: four, one a core, ran the hosted runner out of
      # memory as they started, and it was shut down mid-run.
      - name: Mutation testing
        run: >
          dotnet stryker --config-file stryker-config.json --concurrency ${{ matrix.shard.fonts && 2 || 3 }}
          ${{ matrix.shard.project }} ${{ matrix.shard.tests }} ${{ matrix.shard.mutate }}

      - name: Publish mutation summary
        if: always()
        run: |
          report=$(find StrykerOutput -name 'mutation-report.md' | head -n 1)
          if [ -n "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-${{ matrix.shard.name }}
          path: StrykerOutput/**/reports
          retention-days: 14

  benchmarks:
    name: benchmarks vs QuestPDF
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Reported, not yet gated: regression gating against the main baseline starts with the managed writer
      # (docs/adr/0009-performance-targets.md).
      - name: File sizes
        run: |
          echo "## File size" >> "$GITHUB_STEP_SUMMARY"
          dotnet run --project benchmarks/Rustaveli.Pdf.Benchmarks -c Release -- --sizes | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Throughput and allocations
        run: >
          dotnet run --project benchmarks/Rustaveli.Pdf.Benchmarks -c Release --
          --filter "*" --job short --exporters github json --artifacts artifacts/benchmarks

      - name: Publish benchmark summary
        if: always()
        run: |
          for report in artifacts/benchmarks/results/*-report-github.md; do
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: artifacts/benchmarks/results
          retention-days: 30

  macos:
    name: macos · build, test
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # No portable qpdf build exists for macOS; Homebrew's is the upstream release.
      - name: Install validators (qpdf)
        run: brew install qpdf

      - name: Build (Release, warnings are errors)
        run: dotnet build Rustaveli.Pdf.slnx -c Release

      - name: Test
        run: dotnet test Rustaveli.Pdf.slnx -c Release --no-build
