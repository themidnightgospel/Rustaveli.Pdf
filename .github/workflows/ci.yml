# Tier 1: runs on every push to a pull request and on main. Cheap enough to run constantly; strict enough that
# nothing reaches main without a clean Release build, both runtimes green and the coverage gate met.
# Benchmarks and macOS live in pre-merge.yml and run once a PR is ready to merge; mutation testing runs only at night
# (nightly-mutation.yml).

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  linux:
    name: linux · build, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet tool restore

      # qpdf validates generated files. The font-fallback tests check that characters the test font lacks are found
      # among the platform's fonts: Windows and macOS ship CJK and Georgian faces, the Ubuntu image does not.
      - name: Install validators and fallback fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf fonts-noto-core fonts-noto-cjk

      # veraPDF validates PDF/A and PDF/UA output; it runs on Java.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/tools
          key: tools-${{ runner.os }}-${{ hashFiles('eng/tools.cs') }}

      - name: Fetch validators (veraPDF)
        run: dotnet run eng/tools.cs

      - name: Build (Release, warnings are errors)
        run: dotnet build Rustaveli.Pdf.slnx -c Release

      - name: Test with coverage and enforce the gate
        run: dotnet run eng/coverage.cs

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f artifacts/coverage/report/SummaryGithub.md ]; then
            cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage/report
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: received-snapshots-linux
          path: artifacts/snapshots
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: windows · net10.0 + net48
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/tools
          key: tools-${{ runner.os }}-${{ hashFiles('eng/tools.cs') }}

      - name: Fetch validators (qpdf, veraPDF and its Java)
        run: dotnet run eng/tools.cs

      - name: Build (Release, warnings are errors)
        run: dotnet build Rustaveli.Pdf.slnx -c Release

      - name: Test on both runtimes
        run: dotnet test Rustaveli.Pdf.slnx -c Release --no-build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: received-snapshots-windows
          path: artifacts/snapshots
          if-no-files-found: ignore
          retention-days: 14
