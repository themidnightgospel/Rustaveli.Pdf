# The checks too costly for every push, run once a pull request is labelled ready-to-merge (and again on any push
# after that): the benchmarks, and the build and tests on macOS. A pull request merges only when both
# these and ci.yml are green. They can also be run by hand, on any branch.
#
# The benchmarks run on main too, after every merge, and github-action-benchmark keeps each run's numbers on the
# benchmark-data branch, from which the documentation site draws their history. A pull request's numbers are
# posted on it in two comments: against main's last, where an allocation or a file size more than 10% larger fails
# it (docs/adr/0009-performance-targets.md), and against QuestPDF's from the same run.
#
# Mutation testing is not among them: it takes hours, so it runs only at night, on main (nightly-mutation.yml).

name: Pre-merge checks

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pre-merge-${{ github.event.pull_request.number || github.ref }}
  # A pull request's run gives way to the next push; every merge to main keeps its numbers.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  benchmarks:
    name: benchmarks
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: File sizes
        run: |
          mkdir -p artifacts/benchmarks/results
          echo "## File size" >> "$GITHUB_STEP_SUMMARY"
          dotnet run --project benchmarks/Rustaveli.Pdf.Benchmarks -c Release -- --sizes artifacts/benchmarks/sizes.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Throughput and allocations
        run: >
          dotnet run --project benchmarks/Rustaveli.Pdf.Benchmarks -c Release --
          --filter "*" --job short --exporters github json --artifacts artifacts/benchmarks

      - name: Publish benchmark summary
        if: always()
        run: |
          for report in artifacts/benchmarks/results/*-report-github.md; do
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: The numbers kept
        run: >
          dotnet run eng/benchmarks.cs --
          results artifacts/benchmarks/results artifacts/benchmarks/sizes.json
          artifacts/benchmarks/results/numbers.json artifacts/benchmarks/results/questpdf.json

      # On main, the comparison with QuestPDF the README shows, as a picture for GitHub's light theme and one for its
      # dark, and links to as text, which the publish job keeps beside the history.
      - name: The comparison kept
        if: github.event_name == 'push'
        env:
          BENCHMARK_SOURCE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
          BENCHMARK_COMMIT: ${{ github.sha }}
        run: >
          dotnet run eng/benchmarks.cs --
          questpdf artifacts/benchmarks/results/numbers.json artifacts/benchmarks/results/questpdf.json
          artifacts/benchmarks/results/latest.md
          artifacts/benchmarks/results/latest-light.svg artifacts/benchmarks/results/latest-dark.svg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-results
          path: artifacts/benchmarks/results
          retention-days: 30

  # Main's last numbers, read from the benchmark-data branch, against the pull request's: posted on it, and failing
  # it when an allocation or a file size has grown by more than 10%.
  compare:
    name: benchmarks against main
    if: github.event_name == 'pull_request'
    needs: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The comparison is posted on the pull request, and updated on every push.
      pull-requests: write
    steps:
      # The pull request's own commit, which its table links into: the code each document is made by, line by line.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-results
          path: results

      - name: Main's last numbers
        run: |
          # Until main's first numbers are kept, there are none to read.
          if git fetch --depth 1 origin benchmark-data && git cat-file -e FETCH_HEAD:benchmarks/data.js 2>/dev/null; then
            git show FETCH_HEAD:benchmarks/data.js > main.js
          fi

      - name: Compare
        id: compare
        env:
          BENCHMARK_SOURCE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          dotnet run eng/benchmarks.cs -- compare results/numbers.json results/questpdf.json main.js \
            against-main.md against-questpdf.md || status=$?
          cat against-main.md against-questpdf.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Two comments, against main and against QuestPDF, each found by the marker it starts with and updated on every
      # push. A pull request from a fork has a token that cannot comment; its comparisons are in the summary above.
      - name: Post on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for comment in against-main.md against-questpdf.md; do
            marker=$(head -n 1 "$comment")
            existing=$(gh api "repos/$REPOSITORY/issues/$NUMBER/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
            if [ -n "$existing" ]; then
              gh api --method PATCH "repos/$REPOSITORY/issues/comments/$existing" -F body=@"$comment" > /dev/null
            else
              gh api --method POST "repos/$REPOSITORY/issues/$NUMBER/comments" -F body=@"$comment" > /dev/null
            fi
          done

      - name: Hold to the limit
        if: steps.compare.outputs.status != '0'
        run: |
          echo "::error::An allocation or a file size is more than 10% larger than main's."
          exit 1

  # Each merge's numbers are added to the history on the benchmark-data branch. This job runs no code of the
  # repository's: it only hands the numbers the benchmarks job measured to github-action-benchmark.
  publish:
    name: keep main's benchmarks
    if: github.event_name == 'push'
    needs: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The history is a commit on the benchmark-data branch.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/results

      - uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Rustaveli.Pdf
          tool: customSmallerIsBetter
          output-file-path: ${{ runner.temp }}/results/numbers.json
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: benchmarks
          github-token: ${{ github.token }}
          auto-push: true

      # The comparison with QuestPDF from the same run, which the README shows and its Benchmarks link opens, replaced
      # by every merge's: files, committed beside the history, which the documentation site serves with it.
      - name: Keep the latest comparison
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RESULTS: ${{ runner.temp }}/results
          SHA: ${{ github.sha }}
        run: |
          git fetch --depth 1 origin benchmark-data
          git switch --force -C benchmark-data FETCH_HEAD
          cp "$RESULTS/latest.md" "$RESULTS/latest-light.svg" "$RESULTS/latest-dark.svg" benchmarks/
          git add benchmarks/latest.md benchmarks/latest-light.svg benchmarks/latest-dark.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Latest benchmarks against QuestPDF, for $SHA"
            git push -q "https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git" HEAD:benchmark-data
          fi

  macos:
    name: macos · build, test
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # No portable qpdf build exists for macOS; Homebrew's is the upstream release.
      - name: Install validators (qpdf)
        run: brew install qpdf

      # veraPDF validates PDF/A and PDF/UA output; it runs on Java.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch validators (veraPDF)
        run: dotnet run eng/tools.cs

      - name: Build (Release, warnings are errors)
        run: dotnet build Rustaveli.Pdf.slnx -c Release

      - name: Test
        run: dotnet test Rustaveli.Pdf.slnx -c Release --no-build
