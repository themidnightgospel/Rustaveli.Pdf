<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="300" viewBox="0 0 480 300">
  <style>
    .outline { stroke: #9e9e9e; stroke-width: 3; fill: none; }
    rect.card { fill: #ffe082; }
    #badge { fill: hsl(340, 70%, 75%); }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#80cbc4"/>
      <stop offset="60%" stop-color="#ffe082"/>
      <stop offset="1" style="stop-color: #f48fb1"/>
    </linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="220" y2="0" xlink:href="#bandStops"/>
    <linearGradient id="bandStops">
      <stop offset="0" stop-color="#9e9e9e"/>
      <stop offset="1" stop-color="#80cbc4"/>
    </linearGradient>
    <clipPath id="window">
      <circle cx="400" cy="70" r="45"/>
    </clipPath>
    <symbol id="star" viewBox="0 0 20 20">
      <polygon points="10,1 12.5,7.5 19,7.5 14,11.5 16,18.5 10,14.5 4,18.5 6,11.5 1,7.5 7.5,7.5"/>
    </symbol>
  </defs>

  <rect x="10" y="10" width="140" height="120" rx="16" fill="url(#sky)"/>
  <rect class="card" x="170" y="10" width="140" height="120" rx="10" ry="30"/>
  <circle cx="240" cy="70" r="40" class="outline"/>
  <ellipse id="badge" cx="80" cy="70" rx="45" ry="25" opacity="0.7"/>

  <g clip-path="url(#window)">
    <rect x="340" y="10" width="120" height="120" fill="#80cbc4"/>
    <g transform="translate(400 70) rotate(30)">
      <rect x="-60" y="-8" width="120" height="16" fill="#f48fb1"/>
    </g>
  </g>

  <path class="outline" d="M 20 170 q 40 -40 80 0 t 80 0 s 40 40 60 0 a 25 15 0 1 1 50 0 l 20 20 h 30 v -20 z"/>
  <polyline points="20,230 60,200 100,230 140,200 180,230" stroke="#f48fb1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polygon points="220,200 260,240 200,240" fill="#ffe082" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="20" y1="260" x2="220" y2="260" stroke="url(#band)" stroke-width="10"/>

  <g color="#80cbc4">
    <use xlink:href="#star" x="280" y="180" width="40" height="40" fill="currentColor"/>
    <use href="#star" x="330" y="180" width="60" height="60" fill="#f48fb1" transform="rotate(10 360 210)"/>
  </g>

  <svg x="400" y="170" width="70" height="70" viewBox="0 0 10 10" preserveAspectRatio="none">
    <rect width="10" height="10" fill="#9e9e9e"/>
    <circle cx="5" cy="5" r="3" fill="#ffffff"/>
  </svg>

  <text x="240" y="290" font-family="'Noto Sans', sans-serif" font-size="18" text-anchor="middle" fill="#424242">SVG in <tspan font-weight="bold">vector</tspan></text>
  <g display="none"><rect width="480" height="300" fill="red"/></g>
</svg>
