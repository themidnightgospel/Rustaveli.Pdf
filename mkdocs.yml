      - Decision records:
          - adr/README.md
          - adr/0001-managed-pdf-writer.md
          - adr/0002-print-vocabulary.md
          - adr/0003-api-shape-and-style-sheets.md
          - adr/0004-ink-colour-model.md
          - adr/0005-target-frameworks.md
          - adr/0006-packages-and-dependencies.md
          - adr/0007-quality-gates.md
          - adr/0008-clean-room.md
          - adr/0009-performance-targets.md
          - adr/0010-preview-tooling.md
          - adr/0011-delivery-workflow.md
          - adr/0012-parents-allot-final-size.md
          - adr/0013-span-compatibility-package.md
          - adr/0014-text-is-shaped-once.md
          - adr/0015-text-engine-layers.md
          - adr/0016-drawing-ahead.md
          - adr/0017-draw-order.md
          - adr/0018-tagged-structure.md
          - adr/0019-operations-on-existing-files.md
      - Conventions: CONVENTIONS.md
