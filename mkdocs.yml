# The documentation site, served by GitHub Pages: the pages in docs/, and the API reference DocFX generates from
# the packages' XML documentation into api/ (docs/api/docfx.json). Built and deployed by .github/workflows/docs.yml.
#
#     mkdocs serve        preview while writing (pip install -r docs/requirements.txt first)

site_name: Rustaveli.Pdf
site_description: A completely free, fully featured PDF generator for C# and .NET.
site_url: https://themidnightgospel.github.io/Rustaveli.Pdf/
repo_url: https://github.com/themidnightgospel/Rustaveli.Pdf
repo_name: themidnightgospel/Rustaveli.Pdf
edit_uri: edit/main/docs/
copyright: MIT licence

docs_dir: docs
strict: true

# The API reference is built by DocFX into api/ separately; the requirements are the build's own.
exclude_docs: |
  api/
  overrides/
  requirements.*

theme:
  name: material
  # The home page's template; kept out of the pages by exclude_docs.
  custom_dir: docs/overrides
  logo: images/logo.png
  favicon: images/logo.png
  # An editor's colours, dark first; docs/stylesheets/workbench.css sets them.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/workbench.css

extra_javascript:
  - javascripts/output-panel.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Mermaid diagrams, drawn by the theme: a ```mermaid block.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - Getting started:
      - guide/getting-started.md
      - Coming from QuestPDF: guide/coming-from-questpdf.md
  - Guides:
      - guide/README.md
      - Layout: guide/layout.md
      - Text: guide/text.md
      - Images and artwork: guide/images-and-artwork.md
      - Output: guide/output.md
      - Existing files: guide/existing-files.md
      - Preview and debugging: guide/preview-and-debugging.md
  - How it works:
      - How layout works: how-it-works/layout.md
      - The text engine: how-it-works/text.md
      - Fonts: how-it-works/fonts.md
      - The PDF writer: how-it-works/pdf-writer.md
      - Images: how-it-works/images.md
      - Colour: how-it-works/colour.md
      - Standards: how-it-works/standards.md
      - Encryption: how-it-works/encryption.md
      - Existing files: how-it-works/existing-files.md
      - Page images and preview: how-it-works/rendering-and-preview.md
      - How it's tested: testing.md
      - Performance: performance.md
  - Reference:
      - API reference: https://themidnightgospel.github.io/Rustaveli.Pdf/api/
      - Features: features.md
      - Glossary: GLOSSARY.md
      - Known limitations: limitations.md
  - Project:
      - About: about.md
      - Rustaveli.Pdf and QuestPDF:
          - questpdf.md
